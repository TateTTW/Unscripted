<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unscripted</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #111;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #game {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
        pointer-events: none;
      }
      .overlay > * {
        pointer-events: auto;
      }
      .key-form {
        background: #1d1b26;
        color: #eee;
        border: 2px solid #5a5470;
        padding: 20px 24px;
        width: min(420px, 90vw);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .key-form h1 {
        margin: 0 0 4px;
        font-size: 22px;
        letter-spacing: 2px;
      }
      .key-form p {
        margin: 0;
        font-size: 13px;
        color: #bbb;
      }
      .key-form input {
        font-size: 15px;
        padding: 6px 8px;
        background: #0f0e14;
        color: #eee;
        border: 1px solid #5a5470;
      }
      .key-form .error {
        color: #ff8080;
        min-height: 1em;
      }
      .key-form .buttons {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }
      .overlay button {
        font-size: 14px;
        padding: 6px 12px;
        background: #3b3550;
        color: #fff;
        border: 1px solid #8b84a8;
        cursor: pointer;
      }
      .overlay button:hover {
        background: #4d4568;
      }
      .overlay.bottom {
        align-items: flex-end;
        padding-bottom: 8vh;
      }
      .boot-error {
        position: absolute;
        inset: 0;
        z-index: 20;
        background: #2a0d0d;
        color: #ffd6d6;
        padding: 24px;
        overflow: auto;
        font-family: ui-monospace, monospace;
        font-size: 13px;
      }
      .boot-error h1 {
        font-size: 18px;
        margin-top: 0;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
